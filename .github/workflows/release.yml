name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_plugin.py --check
      - run: python scripts/validate_public_package.py
      - run: |
          mkdir dist
          tar --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 --numeric-owner -czf dist/tgrep-search-v1.0.0.tar.gz plugins/tgrep-search
          sha256sum dist/tgrep-search-v1.0.0.tar.gz > dist/SHA256SUMS
      - uses: softprops/action-gh-release@6cbd405e2c4e5d7e8159b0371b1daebd3b9a16f4
        with:
          generate_release_notes: true
          files: dist/*
