name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_plugin.py --check
      - run: python scripts/validate_public_package.py
      - run: |
          mkdir dist
          tar --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 --numeric-owner -czf dist/tgrep-search-${GITHUB_REF_NAME}.tar.gz plugins/tgrep-search
          sha256sum dist/tgrep-search-${GITHUB_REF_NAME}.tar.gz > dist/SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: dist/*
